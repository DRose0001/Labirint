<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zajček</title>
	<link rel="icon" href="img/ikona.png">
    <style>
        body {
            background-image: url('img/ozadje.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gumbZacni {
            position: absolute;
            top: 100px;
            left: 80px;
            padding: 15px 30px;
            font-size: 18px;
            background-color: #77dd77; /* Pastelno zelena */
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px #66cc66; /* Malo temnejša pastelna za senco */
            font-weight: bold;
            transition: background-color 0.3s ease;
        }

        #gumbZacni:hover {
            background-color: #88ee88;
        }

        #gumbZacni:active {
            box-shadow: 0 2px #66cc66;
            transform: translateY(2px);
        }

        #gumbZacni:disabled {
            background-color: #bdc3c7;
            box-shadow: 0 4px #95a5a6;
            cursor: not-allowed;
        }

        #oknoLabirint {
            position: relative;
            width: 700px; 
            height: 700px; 
            background: url('img/labirint.png') no-repeat center center;
            background-size: contain;
            overflow: visible; 
            border: none;
        }

        #zajcek {
            position: absolute;
            /* Začetna slika je zajcek.gif */
            background: url('img/zajcek.gif') no-repeat center center;
            background-size: contain;
            width: 60px; 
            height: 70px;
            left: 265px; 
            top: 3px;
            z-index: 10;
            pointer-events: none;
            /* Tranzicija tudi za background-image, da je menjava morda mehkejša */
            transition: left 0.5s linear, top 0.5s linear, width 0.5s linear, height 0.5s linear, transform 0.3s ease-in-out, background-image 0.2s linear;
        }

    </style>
</head>
<body>

    <button id="gumbZacni">ZAČNI</button>

    <div id="oknoLabirint">
        <div id="zajcek"></div>
    </div>

    <script>
        const zajcek = document.getElementById('zajcek');
        const gumb = document.getElementById('gumbZacni');
        const izpis = document.getElementById('prikazKoordinat');
        const okno = document.getElementById('oknoLabirint');

        // Seznam točk
        const xT = [270,270,242,242,328,328,357,357,420,420,456,456,481,481,512,512,481,481,422,422,453,453,365,365,390,390,363,363,330,330,271,271,298,298,268,268,238,238,149,149,118,118,178,178,244,244,210,210,175,175,148,148,120,120,54, -250];
        const yT = [17,29,29,88,88,5,5,26,26,86,86,116,116,144,144,235,235,206,206,179,179,148,148,173,173,206,206,293,293,332,332,361,361,420,420,450,450,421,421,388,388,365,365,390,390,331,331,272,272,325,325,298,298,328,328, 310];
        
        let trenutnaTocka = 0;
        const casMedTockami = 500; 

        function premakniZajcka() {
            if (trenutnaTocka < xT.length) {
                let prejsnjiX = trenutnaTocka > 0 ? xT[trenutnaTocka - 1] : 270;
                let trenutniX = xT[trenutnaTocka];

                // Smer gibanja (flip)
                if (trenutniX < prejsnjiX) {
                    zajcek.style.transform = "scaleX(1)";
                } else if (trenutniX > prejsnjiX) {
                    zajcek.style.transform = "scaleX(-1)";
                }

                // Finalna točka
                if (trenutnaTocka === xT.length - 1) {
                    zajcek.style.width = "310px";
                    zajcek.style.height = "320px";
                    zajcek.style.transform = "scaleX(1)"; 
                    
                    // --- NOVA LOGIKA ---
                    // Zamenjamo zajcek.gif s konec.gif
                    zajcek.style.backgroundImage = "url('img/konec.gif')";
                }

                zajcek.style.left = trenutniX + "px";
                zajcek.style.top = yT[trenutnaTocka] + "px";
                
                trenutnaTocka++;
                setTimeout(premakniZajcka, casMedTockami);
            } else {
                gumb.disabled = false;
                gumb.innerText = "PONOVNO";
            }
        }

        gumb.addEventListener('click', function() {
            trenutnaTocka = 0;
            zajcek.style.transition = "none";
            zajcek.style.width = "60px";
            zajcek.style.height = "70px";
            zajcek.style.left = "270px";
            zajcek.style.top = "5px";
            zajcek.style.transform = "scaleX(1)";
            
            // --- PONOVNA PONASTAVITEV ---
            // Vrnemo zajcek.gif, ko začnemo znova
            zajcek.style.backgroundImage = "url('img/zajcek.gif')";

            gumb.disabled = true;
            gumb.innerText = "Tečem...";

            setTimeout(() => {
                zajcek.style.transition = "left 0.5s linear, top 0.5s linear, width 0.5s linear, height 0.5s linear, transform 0.3s ease-in-out, background-image 0.2s linear";
                premakniZajcka();
            }, 50);
        });

        okno.addEventListener('mousemove', function(e) {
            const rect = okno.getBoundingClientRect();
            const x = Math.round(e.clientX - rect.left);
            const y = Math.round(e.clientY - rect.top);
            izpis.innerText = `X: ${x}, Y: ${y}`;
        });
    </script>

</body>
</html>
