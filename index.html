<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labirint - Klikni za Začetek</title>
    <style>
        body {
            background-image: url('ozadje.png');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            margin: 0;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Gumb za začetek */
        #gumbZacni {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 15px 30px;
            font-size: 18px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px #27ae60;
        }

        #gumbZacni:active {
            box-shadow: 0 2px #27ae60;
            transform: translateY(2px);
        }

        #oknoLabirint {
            position: absolute;
            width: 700px; 
            height: 700px; 
            left: 50%;  
            top: 50%;  
            transform: translate(-50%, -50%); 
            overflow: visible;
        }

        #labirint {
            position: absolute;
            width: 100%;
            height: 100%;
            background: url('labirint.png') no-repeat center center;
            background-size: contain;
            transition: opacity 1s ease;
            z-index: 1;
        }
        #kos {
            position: absolute;
            width: 200px; 
            height: 200px;
            left: -150px; 
            top: 450px; /* Še malo nižje, kot si želel */
            z-index: 3;
        }
        
        #zajcek {
            position: absolute; /* Dodano: nujno za premikanje */
            background: url('zajcek.gif') no-repeat center center;
            background-size: contain;
            width: 50px; 
            height: 60px;
            left: 270px; 
            top: 5px;
            z-index: 2;
        }

        #prikazKoordinat {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <button id="gumbZacni">ZAČNI</button>

    <div id="oknoLabirint">
        <div id="prikazKoordinat">X: 0, Y: 0</div>
        <div id="labirint"></div>
        <div id="zajcek"></div>
        <img src="kos.png" id="kos" alt="Igralni kos">
    </div>

    <script>
        const okno = document.getElementById('oknoLabirint');
        const izpis = document.getElementById('prikazKoordinat');
        const zajcek = document.getElementById('zajcek');
        const gumb = document.getElementById('gumbZacni');

        const xT = [295, 263, 263, 351, 351];
        const yT = [71, 71, 138, 138, 46];
        
        let trenutnaTocka = 0;
        const intervalMedTockami = 500; // 500ms (pol sekunde) za boljšo vidljivost

        function premakniZajcka() {
            if (trenutnaTocka < xT.length) {
                zajcek.style.left = xT[trenutnaTocka] + "px";
                zajcek.style.top = yT[trenutnaTocka] + "px";
                
                trenutnaTocka++;
                
                // Naslednji korak
                setTimeout(premakniZajcka, intervalMedTockami);
            } else {
                // Ponastavimo za naslednjič, ko kliknemo gumb
                trenutnaTocka = 0;
                gumb.disabled = false;
                gumb.innerText = "PONOVNO";
            }
        }

        // Dogodek ob kliku na gumb
        gumb.addEventListener('click', function() {
            gumb.disabled = true; // Onemogoči gumb med premikanjem
            gumb.innerText = "Premikanje...";
            premakniZajcka();
        });

        // Sledenje miški za koordinate
        okno.addEventListener('mousemove', function(e) {
            const rect = okno.getBoundingClientRect();
            const x = Math.round(e.clientX - rect.left);
            const y = Math.round(e.clientY - rect.top);
            izpis.innerText = `X: ${x}, Y: ${y}`;
        });
    </script>

</body>
</html>
